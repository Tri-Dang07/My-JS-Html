<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Internal JavaScript</title>
</head>
<body>
    <h1>Cách chèn JavaScript: Internal</h1>
    <button id="btnInternal">Bấm vào đây</button>

    <script>
        const btn = document.getElementById('btnInternal');
        btn.addEventListener('click', function() {
            alert('Bạn vừa bấm vào nút Internal!');
        });
    </script>
</body>
</html>
